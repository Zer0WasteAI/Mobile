name: zer0_waste_ai
description: "AI-powered app to reduce food waste through ingredient scanning
  and personalized recipes."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  app_tracking_transparency: ^2.0.6+1
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  cloud_firestore: ^5.6.8
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  equatable: ^2.0.7
  firebase_analytics: ^11.4.6
  firebase_app_check: ^0.3.2+6
  firebase_auth: ^5.5.4
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.6
  firebase_storage: ^12.4.6
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_facebook_auth: ^7.0.0
  flutter_hooks: ^0.21.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.8.0
  freezed_annotation: ^3.0.0
  go_router: ^15.1.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.5.1
  iconsax_flutter: ^1.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  json_annotation: ^4.9.0
  lottie: ^3.3.1
  path: ^1.8.3
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  pinput: ^5.0.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  sign_in_with_apple: ^7.0.1
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:

  # Code generation
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/images/scan/
    - assets/images/user_preferences/
    - assets/images/user_preferences/cooking_levels/
    - assets/images/splash/

    - assets/icons/
    - assets/icons/navbar/
    - assets/icons/home/

    - assets/animations/

    - lib/core/constants/
