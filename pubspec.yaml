name: zer0_waste_ai
description: "AI-powered app to reduce food waste through ingredient scanning and personalized recipes."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1

  # UI
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  smooth_page_indicator: ^1.1.0

  # Navigation
  go_router: ^15.1.0

  # Authentication
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  pinput: ^5.0.1

  # Image Picking
  image_picker: ^1.1.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/scan/
    - assets/images/user_preferences/
    - assets/images/user_preferences/cooking_levels/
    - assets/images/splash/

    - assets/icons/
    - assets/icons/navbar/
    - assets/icons/home/

    - lib/core/constants/
