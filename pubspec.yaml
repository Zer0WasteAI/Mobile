name: zer0_waste_ai
description: "AI-powered app to reduce food waste through ingredient scanning and personalized recipes."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5

  # UI
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  smooth_page_indicator: ^1.1.0

  # Navigation
  go_router: ^15.1.0

  # Authentication
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  pinput: ^5.0.1

  # Image Picking
  image_picker: ^1.1.2

  # Data classes & serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  flutter_slidable: ^4.0.0
  lottie: ^3.3.1
  carousel_slider: ^5.0.0
  percent_indicator: ^4.2.5
  url_launcher: ^6.3.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^3.0.6
  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/scan/
    - assets/images/user_preferences/
    - assets/images/user_preferences/cooking_levels/
    - assets/images/splash/

    - assets/icons/
    - assets/icons/navbar/
    - assets/icons/home/
    
    - assets/animations/

    - lib/core/constants/
